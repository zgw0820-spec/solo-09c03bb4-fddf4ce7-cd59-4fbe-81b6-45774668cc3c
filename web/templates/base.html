<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}批编译 jobserver 演练台{% endblock %}</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #ffffff; --ink: #0f172a; --muted: #64748b;
      --line: #e2e8f0; --brand: #2563eb; --brand-d: #1d4ed8;
      --ok: #15803d; --okbg: #dcfce7; --bad: #b91c1c; --badbg: #fee2e2;
      --warn: #b45309; --warnbg: #fef3c7; --run: #1d4ed8; --runbg: #dbeafe;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: -apple-system, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background:#f1f5f9; color:var(--ink); }
    header.top { background:linear-gradient(120deg,#0f172a,#1e3a8a); color:#fff;
      padding:18px 28px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
    header.top h1 { font-size:19px; margin:0; letter-spacing:.5px; }
    header.top .sub { color:#bfdbfe; font-size:13px; }
    header.top a { color:#bfdbfe; text-decoration:none; }
    main { max-width:1180px; margin:24px auto; padding:0 20px 60px; }
    .grid { display:grid; grid-template-columns: 380px 1fr; gap:20px; }
    @media (max-width: 900px){ .grid{ grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
      padding:20px 22px; box-shadow:0 1px 2px rgba(15,23,42,.05); margin-bottom:20px; }
    .card h2 { font-size:15px; margin:0 0 14px; }
    label.opt { display:flex; gap:10px; align-items:flex-start; border:1.5px solid var(--line);
      border-radius:10px; padding:12px 14px; margin-bottom:10px; cursor:pointer; transition:.12s; }
    label.opt:hover { border-color:#93c5fd; }
    label.opt input { margin-top:3px; }
    label.opt.sel { border-color:var(--brand); background:#eff6ff; }
    .opt .big { font-weight:700; font-size:15px; }
    .opt .desc { color:var(--muted); font-size:12.5px; margin-top:2px; line-height:1.5; }
    .checkline { display:flex; gap:9px; align-items:center; margin:14px 0 16px; font-size:14px; }
    .checkline input { width:16px; height:16px; }
    button.primary { width:100%; border:0; border-radius:10px; padding:13px 16px; font-size:15px;
      font-weight:700; color:#fff; background:var(--brand); cursor:pointer; }
    button.primary:hover { background:var(--brand-d); }
    button.primary:disabled { background:#94a3b8; cursor:not-allowed; }
    .hint { font-size:12.5px; color:var(--muted); line-height:1.7; }
    code, .mono { font-family:var(--mono); font-size:12.5px; }
    .principle { font-size:13px; line-height:1.85; color:#334155; }
    .principle code { background:#f1f5f9; padding:1px 6px; border-radius:5px; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:middle; }
    th { color:var(--muted); font-weight:600; font-size:12.5px; background:#f8fafc; }
    tr:last-child td { border-bottom:0; }
    .badge { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;
      white-space:nowrap; }
    .b-ok { background:var(--okbg); color:var(--ok); }
    .b-bad { background:var(--badbg); color:var(--bad); }
    .b-warn { background:var(--warnbg); color:var(--warn); }
    .b-run { background:var(--runbg); color:var(--run); }
    .b-muted { background:#e2e8f0; color:#475569; }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:20px; }
    .metric { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
    .metric .k { color:var(--muted); font-size:12.5px; }
    .metric .v { font-size:26px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; }
    .metric .v small { font-size:14px; color:var(--muted); font-weight:600; }
    .metric.good .v { color:var(--ok); } .metric.bad .v { color:var(--bad); }
    pre.log { background:#0b1220; color:#dbe7ff; padding:16px 18px; border-radius:12px;
      font-family:var(--mono); font-size:12px; line-height:1.55; overflow:auto; max-height:640px;
      white-space:pre-wrap; word-break:break-word; margin:0; }
    .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .toolbar a, .toolbar button { font-size:13px; }
    a.btn { display:inline-block; border:1px solid var(--line); background:#fff; border-radius:8px;
      padding:7px 13px; text-decoration:none; color:var(--ink); font-weight:600; }
    a.btn:hover { border-color:#93c5fd; color:var(--brand); }
    .live-dot { width:9px; height:9px; border-radius:50%; background:var(--run);
      display:inline-block; margin-right:6px; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .spark { width:100%; height:150px; display:block; }
    .muted { color:var(--muted); }
    .empty { padding:34px; text-align:center; color:var(--muted); font-size:14px; }
    .jtag { font-family:var(--mono); font-weight:700; }
  </style>
</head>
<body>
  <header class="top">
    <h1>采集插件 CI · 批编译助手演练台</h1>
    <span class="sub">Python batchcc × GNU Make 4.3 管道 jobserver × Flask × Docker Compose</span>
    <span style="flex:1"></span>
    <a href="/">← 返回演练列表</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
